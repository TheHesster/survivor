{{ define "main" }}

<main class="pt-5">
<div class="container-fluid text-center py-5">
  <div class="row">
    <div class="col"></div>
    <div class="col-6">
        <div class="logo">
            <img src="/static/images/SurvivorLogo.png" alt="Survivor Logo" class="img-fluid" width="400"></img>
        </div>
    </div>
    <div class="col"></div>
  </div>
</div>
<div class="container-fluid text-center">
  <div class="row">
    <div class="col"></div>
    <div class="col-8 bg-dark m-1 p-4 rounded shadow-lg opacity-75">
      <div class="decription text-light">
        {{ range (where site.RegularPages "Section" "seasons").ByDate }}
        <a href="{{ .RelPermalink }}" type="button" class="btn btn-outline-light mb-2" role="button">{{ .Title }}</a>
        {{ end }}
      </div>
    </div>
    <div class="col"></div>
  </div>
</div>

</main>

{{ end }}
